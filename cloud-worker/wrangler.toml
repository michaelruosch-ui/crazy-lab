name = "crazylab-sync"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Wird durch `npx wrangler kv namespace create CRAZYLAB_KV` erzeugt (siehe README.md in diesem
# Ordner) - die dabei ausgegebene id hier eintragen, bevor `npm run deploy` läuft.
[[kv_namespaces]]
binding = "CRAZYLAB_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
